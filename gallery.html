<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · North River Tugboat Museum</title>
<meta name="description" content="Videos from the North River Tugboat Museum, including the raising and restoration of Pennsylvania Railroad Barge No. 399.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="wrap">
    <a class="home" href="./">North River Tugboat Museum</a>
    <nav aria-label="Main">
      <a href="./#about">About</a>
      <a href="gallery.html" aria-current="page">Gallery</a>
      <a href="./#contact">Contact</a>
    </nav>
  </div>
</header>

<div class="hull short">
  <div class="wrap">
    <h1>Gallery</h1>
    <p>Videos from our raisings and restorations.</p>
  </div>
</div>

<main>
  <section id="videos">
    <div class="wrap">
      <!--
        To add another video: copy one whole <figure> block below,
        then change the ID after /embed/ and the title and caption text.
      -->
      <div class="videos">
        <figure class="video">
          <div class="frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/xeMvElxNL10?rel=0"
              title="399 Initial Raising"
              loading="lazy"
              allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>
          </div>
          <figcaption>399 Initial Raising</figcaption>
        </figure>

        <figure class="video">
          <div class="frame">
            <iframe
              src="https://www.youtube-nocookie.com/embed/yLGAG5sL97Q?rel=0"
              title="399 Deck Restoration"
              loading="lazy"
              allow="accelerometer; encrypted-media; gyroscope; picture-in-picture; web-share"
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen></iframe>
          </div>
          <figcaption>399 Deck Restoration</figcaption>
        </figure>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">&copy; <span id="year">2026</span> North River Tugboat Museum</div>
</footer>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>

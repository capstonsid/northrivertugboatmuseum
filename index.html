<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>North River Tugboat Museum: Coming Soon</title>
<meta name="description" content="The North River Tugboat Museum website is coming soon.">
<style>
  :root { --bg:#0f2a3d; --fg:#f4efe6; --accent:#d9a441; --muted:#a9bccb; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; }
  body {
    background: radial-gradient(ellipse at top, #1d4560 0%, var(--bg) 65%);
    color: var(--fg);
    font-family: Georgia, "Times New Roman", serif;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px 16px;
  }
  main { max-width:640px; }
  svg { width:120px; height:auto; margin-bottom:24px; }
  .kicker { letter-spacing:.25em; text-transform:uppercase; font-size:.8rem; color:var(--accent); margin:0 0 12px; font-family: Arial, Helvetica, sans-serif; }
  h1 { font-size:clamp(2rem, 6vw, 3.2rem); line-height:1.1; margin:0 0 20px; font-weight:normal; }
  p { font-size:1.15rem; line-height:1.6; color:var(--muted); margin:0 auto; }
  .rule { width:60px; height:2px; background:var(--accent); margin:28px auto; border:0; }
  footer { font-size:.9rem; color:var(--muted); font-family: Arial, Helvetica, sans-serif; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 120 70" aria-hidden="true" fill="none" stroke="#d9a441" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 46 h104 l-10 14 H20 z"/>
    <path d="M34 46 V30 h38 v16"/>
    <path d="M44 30 V20 h18 v10"/>
    <path d="M78 46 V24 h8 v22"/>
    <path d="M4 66 q8 -4 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0"/>
  </svg>
  <p class="kicker">North River Tugboat Museum</p>
  <h1>Our new website is coming soon</h1>
  <p>We're restoring this site the same way we restore our boats: carefully, one piece at a time. Check back soon.</p>
  <hr class="rule">
  <footer>&copy; North River Tugboat Museum</footer>
</main>
</body>
</html>
